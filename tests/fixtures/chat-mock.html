<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Mock chat</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #212121; color: #ececec; }
  main { max-width: 720px; margin: 0 auto; padding: 40px 20px 200px; display: flex; flex-direction: column; gap: 24px; }
  [data-message-author-role="user"] { align-self: flex-end; background: #303030; padding: 10px 14px; border-radius: 18px; max-width: 70%; }
  [data-message-author-role="assistant"] { line-height: 1.6; }
  textarea { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 680px; height: 60px; border-radius: 20px; background: #303030; color: #fff; border: 0; padding: 12px; }
</style>
</head>
<body>
<main id="thread">
  <div data-message-author-role="user">Write a post about the dog that came home. Headline: and Caption: please.</div>
</main>
<textarea placeholder="Message ChatGPT">Headline: this is my draft, never read it
Caption: also never read</textarea>
</body>
</html>
